name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    runs-on:
      labels: "runs-on=${{ github.run_id }}/image=ubuntu24-full-x64"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
